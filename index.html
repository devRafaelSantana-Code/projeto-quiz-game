<!doctype html>
<html lang="pt-BR">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Quiz Game</title>
      <link rel="stylesheet" href="./style.css" />
   </head>
   <body>
      <div class="container">
         <div class="progress">
            <div class="progress--bar"></div>
         </div>

         <h1>Quiz Game</h1>
         <h2 class="start mensagem-status">O jogo Iniciou!</h2>
         <div class="questionArea">
            <div class="question">...</div>
            <div class="options"></div>
         </div>

         <div class="scoreArea">
            <img src="prize.png" class="prizeImage" />
            <div class="scoreText1">Parabéns!</div>
            <div class="scorePct">Acertou 100%</div>
            <div class="scoreText2">
               Você respondeu 10 questões e acertou 10.
            </div>
            <button>Reiniciar</button>
         </div>
      </div>

      <footer>Criado por Dev. Rafael Santana</footer>

      <script src="./questions.js"></script>
      <script src="./script.js"></script>
   </body>
</html>
